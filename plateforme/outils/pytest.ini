[pytest]
# `pythonpath = .` rend `from schema import ...` fiable quel que soit le mode
# d'invocation. Sans lui, seul `python -m pytest` fonctionne (il ajoute le
# repertoire courant a sys.path), et un `pytest` nu echoue a l'import.
pythonpath = .
# 100 depuis le 27 septembre 2026 : ce dossier n'est que de la logique pure —
# un schema, un validateur, un generateur, un constructeur. Rien n'y justifie
# une ligne non mesuree, et les trois `principal()` sont precisement ce que le
# Dockerfile appelle. C'est un cliquet, il ne redescend pas.
addopts = --cov=. --cov-report=term-missing --cov-fail-under=100
