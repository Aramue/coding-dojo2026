id: s4-31
concept: bits
notion: decoder
seance: 4
niveau: normal
type: predire
titre: Le décalage de bits
obligatoire: true
enonce: |
  L'opérateur `>>` décale les bits vers la droite : le dernier bit disparaît. Le
  nombre 6 s'écrit 110. Que montre l'écran ?
depart: |
  valeur = 6
  print(valeur >> 1)
  print(valeur & 1)
indices:
  - 110 décalé d'un cran à droite devient 11.
  - valeur & 1 ne garde que le dernier bit de 110.
tests:
  - type: qcm
    options:
      - |-
        3
        1
      - |-
        3
        0
      - |-
        0
        3
    bonne_reponse: 1
solution: |
  valeur = 6
  print(valeur >> 1)
  print(valeur & 1)
