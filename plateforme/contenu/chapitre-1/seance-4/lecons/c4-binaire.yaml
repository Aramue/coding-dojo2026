id: c4-binaire
notion: binaire
ordre: 18
titre: Binaire et caractères
duree_min: 4
blocs:
  - type: paragraphe
    texte: 'Un ordinateur écrit les nombres avec des **bits**, qui valent 0 ou 1. Huit bits forment un **octet**. De droite à gauche, chaque bit vaut le double du précédent : 1, 2, 4, 8, 16, 32, 64, 128.'
  - type: paragraphe
    texte: 'L''octet `01110101` vaut donc 64 + 32 + 16 + 4 + 1, soit **117**. En Python, `int()` fait ce calcul si on lui donne la base en second nombre : 2 veut dire « binaire ».'
  - type: code
    legende: Du binaire au nombre
    executable: true
    python: |
      octet = "01110101"
      print(int(octet, 2))
  - type: attention
    texte: '**Sans la base, `int()` lit du décimal.** `int("101")` donne cent un, et `int("101", 2)` donne cinq. Le texte est le même : seule la base change le résultat.'
  - type: paragraphe
    texte: Chaque caractère a un numéro, fixé par la table **ASCII**. `chr()` rend le caractère d'un numéro, et `ord()` rend le numéro d'un caractère.
  - type: code
    legende: Un numéro, un caractère
    executable: true
    python: |
      print(chr(117))
      print(ord("u"))
      print(chr(65))
  - type: paragraphe
    texte: 'Pour passer d''un octet à une lettre, on enchaîne deux conversions : du texte binaire au nombre avec `int(..., 2)`, puis du nombre à la lettre avec `chr()`. Une expression imbriquée se lit de l''intérieur vers l''extérieur.'
  - type: code
    legende: D'un octet à une lettre
    executable: true
    python: |
      octet = "01110101"
      nombre = int(octet, 2)
      lettre = chr(nombre)
      print(lettre)
      print(chr(int(octet, 2)))
  - type: paragraphe
    texte: Les lettres majuscules occupent les numéros 65 à 90, et l'espace porte le numéro 32. Un message fait de majuscules et d'espaces se lit donc octet par octet.
  - type: code
    legende: Les premières majuscules
    executable: true
    python: |
      for n in range(65, 70):
          print(n, chr(n))
