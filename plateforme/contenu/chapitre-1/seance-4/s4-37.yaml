solution: |
  def get_lsb(value_of_color):
      """Rend les 2 derniers bits (LSB) d'une valeur de couleur, sous la forme (lsb1, lsb2)."""
      ex_value = int(value_of_color) & 0b11
      lsb1 = (ex_value >> 1) & 1
      lsb2 = ex_value & 1
      return lsb1, lsb2

  image = [
      [  # ligne 0
          [25, 77, 202], [28, 48, 187], [221, 19, 44], [44, 35, 123],
          [113, 30, 63], [112, 203, 25], [215, 68, 148], [95, 60, 157],
          [49, 96, 190], [252, 30, 105], [234, 160, 238], [94, 153, 127],
          [253, 41, 153], [36, 229, 147], [175, 214, 84], [23, 250, 215],
      ],
      [  # ligne 1
          [39, 160, 174], [179, 254, 233], [35, 47, 138], [242, 33, 31],
          [158, 228, 145], [197, 177, 11], [236, 181, 86], [59, 252, 30],
          [111, 147, 66], [126, 203, 200], [254, 41, 85], [229, 205, 142],
          [70, 220, 142], [212, 183, 194], [118, 77, 42], [90, 77, 118],
      ],
  ]

  bits = []
  for pixel in image[0]:
      bit1, bit2 = get_lsb(pixel[0])
      bits.append(bit1)
      bits.append(bit2)

  message = ""
  for i in range(0, len(bits), 8):
      octet = ""
      for j in range(8):
          octet = octet + str(bits[i + j])
      message = message + chr(int(octet, 2))

  print(message)
