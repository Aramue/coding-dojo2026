id: s3-26
concept: accumulateur
notion: compter
seance: 3
niveau: normal
type: completer
titre: La somme des chiffres
obligatoire: false
enonce: |
  Ce programme additionne les chiffres d'un code. Complète le trou pour que la
  variable `somme` contienne bien la somme des chiffres, et non une erreur.
depart: |
  code = 4729
  somme = 0
  for chiffre in str(code):
      somme = somme + _____(chiffre)
  print("Somme des chiffres :", somme)
indices:
  - Chaque chiffre du tour est un caractère, donc du texte. Peut-on additionner du texte à un nombre ?
  - La fonction qui transforme un texte en nombre entier est celle qu'on place autour de input().
tests:
  - type: variable
    nom: somme
    valeur_attendue: "22"
    type_attendu: int
  - type: contient
    motif: int(
solution: |
  code = 4729
  somme = 0
  for chiffre in str(code):
      somme = somme + int(chiffre)
  print("Somme des chiffres :", somme)
