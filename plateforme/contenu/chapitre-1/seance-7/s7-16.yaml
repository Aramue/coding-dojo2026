id: s7-16
concept: diff
notion: diff
seance: 7
niveau: normal
type: ecrire
titre: Mon propre diff
obligatoire: true
enonce: Les listes `avant` et `apres` contiennent les lignes d'un fichier avant et après une modification. Affiche d'abord chaque ligne retirée, précédée de `- `, puis chaque ligne ajoutée, précédée de `+ `.
depart: |
  avant = ["x = 1", "y = 2", "z = 3"]
  apres = ["x = 1", "y = 5", "z = 3", "t = 9"]
indices:
- 'Il faut deux boucles : une sur `avant`, une sur `apres`.'
- Une ligne retirée est dans `avant` et pas dans `apres` ; une ligne ajoutée, l'inverse.
tests:
- type: sortie
  entrees: []
  attendu: |-
    - y = 2
    + y = 5
    + t = 9
- type: contient
  motif: not in
  message: Teste l'absence d'une ligne dans l'autre liste avec not in.
- type: interdit
  motif: '- y = 2'
  message: Les lignes doivent venir des listes, pas être écrites en dur.
- type: interdit
  motif: + y = 5
  message: Les lignes doivent venir des listes, pas être écrites en dur.
solution: |-
  avant = ["x = 1", "y = 2", "z = 3"]
  apres = ["x = 1", "y = 5", "z = 3", "t = 9"]

  for ligne in avant:
      if ligne not in apres:
          print("-", ligne)
  for ligne in apres:
      if ligne not in avant:
          print("+", ligne)
