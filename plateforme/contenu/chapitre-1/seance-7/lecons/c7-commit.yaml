id: c7-commit
notion: commit
ordre: 31
titre: Le commit et ses conventions
duree_min: 5
blocs:
- type: paragraphe
  texte: 'Un **commit** est une photo du projet à un instant, accompagnée d''un message. Tu as déjà choisi ce qui y entre avec `git add` ; il reste à la prendre : `git commit -m "message"`.'
- type: schema
  nom: commits
  legende: Chaque commit garde les fichiers à cet instant, son auteur, sa date et son message.
- type: terminal
  legende: Faire un commit
  texte: |-
    $ git add moyenne.py
    $ git commit -m "fix: corrige la division par zéro"
    [main 4b2e9d1] fix: corrige la division par zéro
     1 file changed, 1 insertion(+), 1 deletion(-)
- type: paragraphe
  texte: Un historique de messages comme « modif », « truc » ou « fini » ne sert à personne, pas même à toi dans trois semaines.
- type: terminal
  legende: Un historique illisible
  texte: |-
    $ git log --oneline
    9f3a1c2 modif
    7d2b8e4 fini
    c01e5a9 truc
- type: paragraphe
  texte: 'On suit donc une **convention** : `type: description`. Le type dit la nature du changement : `feat` ajoute une fonctionnalité · `fix` corrige un bug · `docs` touche à la documentation · `refactor` réécrit sans changer le résultat · `chore` range ou règle (tâche annexe).'
- type: paragraphe
  texte: La description commence par un **verbe** (ajoute, corrige, explique), tient en **50 caractères** environ et ne finit pas par un point.
- type: paragraphe
  texte: 'Pour relire ce qui a été fait, on utilise **`git log`**. Il liste les commits un par un, avec leur auteur, leur date et leur message. `git log --oneline` en donne la version courte : une ligne par commit, qui commence par un identifiant de sept caractères (le **hash**), suivi du message.'
- type: terminal
  legende: git log --oneline
  texte: |-
    $ git log --oneline
    4b2e9d1 fix: corrige la division par zéro
    8a41b07 feat: ajoute la médiane
    5e2c6aa feat: ajoute le calcul de la moyenne
- type: paragraphe
  texte: L'historique se lit **du plus récent, en haut, au plus ancien, en bas**. Le premier commit du projet est donc la dernière ligne.
- type: attention
  texte: '**Le message est entre guillemets.** `git commit -m fix: corrige` sans guillemets est mal lu par le terminal. Et un fichier modifié mais pas ajouté avec `git add` n''entre pas dans le commit : git répond qu''il n''y a rien à valider.'
