id: c7-commit
notion: commit
ordre: 30
titre: Le commit et ses conventions
duree_min: 4
blocs:
  - type: paragraphe
    texte: >-
      Un **commit** est une photo du projet à un instant, accompagnée d'un message. Il se fait en deux gestes : `git add fichier` choisit ce qui entrera dans la photo, puis `git commit -m "message"` la prend.
  - type: paragraphe
    texte: >-
      Un historique de messages comme « modif », « truc » ou « fini » ne sert à personne, pas même à toi dans trois semaines. On suit donc une **convention** : `type: description`. Le type dit la nature du changement.
  - type: paragraphe
    texte: >-
      `feat` ajoute une fonctionnalité · `fix` corrige un bug · `docs` touche à la documentation · `refactor` réécrit sans changer le résultat · `chore` range ou règle (tâche annexe).
  - type: paragraphe
    texte: >-
      La description commence par un **verbe** (ajoute, corrige, explique), tient en **50 caractères** environ et ne finit pas par un point. Exemple : `fix: corrige la division par zéro`.
  - type: code
    legende: Découper un message de commit
    executable: true
    python: |
      message = "fix: corrige la division par zéro"
      morceaux = message.split(": ")
      print(morceaux[0])
      print(morceaux[1])
      print(len(message))
  - type: attention
    texte: >-
      **Le message est entre guillemets.** `git commit -m fix: corrige` sans guillemets est mal lu par le terminal. Et sans `git add` avant, git répond qu'il n'y a rien à valider.
