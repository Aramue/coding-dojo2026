id: c7-diff
notion: diff
ordre: 33
titre: Voir la différence
duree_min: 3
blocs:
  - type: paragraphe
    texte: >-
      Avant de committer, on regarde ce qui a changé : `git diff` compare ton fichier à sa dernière version validée, ligne par ligne. Une ligne qui commence par `-` a été **retirée**, une ligne qui commence par `+` a été **ajoutée**. Une ligne modifiée apparaît deux fois : l'ancienne en `-`, la nouvelle en `+`.
  - type: code
    legende: Calculer une différence à la main
    executable: true
    python: |
      avant = ["a = 10", "b = 5", "print(a + b)"]
      apres = ["a = 10", "b = 6", "print(a + b)"]

      for ligne in avant:
          if ligne not in apres:
              print("-", ligne)
      for ligne in apres:
          if ligne not in avant:
              print("+", ligne)
  - type: paragraphe
    texte: >-
      Une fois le fichier ajouté avec `git add`, `git diff` ne montre plus rien : le changement est dans l'index. Pour le voir, on écrit `git diff --staged`.
  - type: attention
    texte: >-
      **Lis toujours le diff avant un commit.** C'est là qu'on découvre le `print` de débogage oublié, ou la ligne qu'on n'avait pas l'intention de toucher.
