id: c7-equipe
notion: equipe
ordre: 37
titre: "Bonus : travailler en équipe"
duree_min: 3
blocs:
  - type: paragraphe
    texte: >-
      Un dépôt partagé tient grâce à quelques habitudes : **on tire avant de travailler** (`git pull`), **on ne committe pas directement sur `main`** (on passe par une branche et une pull request), **on fait des commits petits** avec un message clair, et **on relit** le travail des autres avant de fusionner.
  - type: paragraphe
    texte: >-
      Un historique bien tenu répond à des questions : qui a écrit cette ligne, et pourquoi ? Quand ce bug est-il apparu ? Les messages `feat:` et `fix:` en font un journal que n'importe qui peut relire.
  - type: code
    legende: Combien de commits par personne ?
    executable: true
    python: |
      commits = [
          {"auteur": "Camille", "message": "feat: ajoute le menu"},
          {"auteur": "Leo", "message": "fix: corrige le calcul"},
          {"auteur": "Camille", "message": "docs: explique le menu"},
      ]
      compte = {}
      for commit in commits:
          auteur = commit["auteur"]
          if auteur in compte:
              compte[auteur] += 1
          else:
              compte[auteur] = 1
      print(compte)
  - type: attention
    texte: >-
      **Une critique porte sur le code, jamais sur la personne.** Dans une pull request, on écrit « cette ligne plantera si la liste est vide », pas « tu n'as pas réfléchi ».
