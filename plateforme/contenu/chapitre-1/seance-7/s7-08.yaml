titre: Quel message ?
obligatoire: true
enonce: 'Quel message de commit suit la convention `type: description` ?'
depart: ''
indices:
- Le message doit commencer par un type, comme feat ou fix, suivi de deux-points.
- La description commence par un verbe et ne finit pas par un point.
