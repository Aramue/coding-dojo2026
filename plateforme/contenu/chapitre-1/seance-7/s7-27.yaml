id: s7-27
concept: branches
notion: branches
seance: 7
niveau: expert
type: predire
titre: Main n'a pas bougé
obligatoire: false
enonce: Camille fait ces commandes. Après le dernier `git switch`, le fichier `idee.py` est-il dans son dossier ?
depart: |-
  $ git switch -c essai
  $ git add idee.py
  $ git commit -m "feat: ajoute idee.py"
  $ git switch main
indices:
- Sur quelle branche le commit a-t-il été fait ?
- Revenir sur `main`, c'est retrouver `main` tel qu'il était.
tests:
- type: qcm
  options:
  - 'Oui : les commits sont partagés par toutes les branches.'
  - 'Non : le commit est sur la branche `essai`, et `main` n''a pas changé.'
  - Oui, mais vide.
  bonne_reponse: 1
solution: |-
  $ git switch -c essai
  $ git add idee.py
  $ git commit -m "feat: ajoute idee.py"
  $ git switch main
