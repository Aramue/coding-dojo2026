id: s7-09
concept: commit
notion: commit
seance: 7
niveau: normal
type: ecrire
titre: Le message est-il valide ?
obligatoire: true
enonce: 'Lis un message de commit avec `input()`. Affiche `valide` s''il suit la convention, sinon `invalide`. Il est valide si : il contient `: `, son type est `feat`, `fix`, `docs`, `refactor` ou `chore`, sa description n''est pas vide et il fait 50 caractères au plus.'
depart: |
  message = input()
indices:
- 'Trois conditions à vérifier : :  présent, longueur, puis type et description. Un drapeau valide aide.'
- 'Découpe avec split(": "), puis teste morceaux[0] in types et morceaux[1] != "".'
tests:
- type: sortie
  entrees:
  - 'feat: ajoute le menu'
  attendu: |-
    feat: ajoute le menu
    valide
- type: sortie
  entrees:
  - modif
  attendu: |-
    modif
    invalide
- type: sortie
  entrees:
  - 'truc: ajoute le menu'
  attendu: |-
    truc: ajoute le menu
    invalide
- type: sortie
  entrees:
  - 'fix: '
  attendu: |-
    fix:
    invalide
- type: sortie
  entrees:
  - 'docs: explique en détail comment lancer le programme chez soi'
  attendu: |-
    docs: explique en détail comment lancer le programme chez soi
    invalide
- type: interdit
  motif: 'import '
  message: Pas besoin d'importer quoi que ce soit.
solution: |-
  message = input()
  types = ["feat", "fix", "docs", "refactor", "chore"]
  valide = False
  if ": " in message and len(message) <= 50:
      morceaux = message.split(": ")
      if morceaux[0] in types and morceaux[1] != "":
          valide = True
  if valide:
      print("valide")
  else:
      print("invalide")
