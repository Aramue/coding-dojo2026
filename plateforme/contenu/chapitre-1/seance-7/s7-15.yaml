id: s7-15
concept: suivis
notion: suivis
seance: 7
niveau: normal
type: predire
titre: Ce qui entre dans le commit
obligatoire: true
enonce: 'Camille lit ce `git status`, puis fait `git commit -m "docs: explique le programme"`. Quel fichier entre dans le commit ?'
depart: |-
  $ git status
  Changes to be committed:
          modified:   README.md

  Changes not staged for commit:
          modified:   moyenne.py

  Untracked files:
          notes.md
indices:
- Seule la section « Changes to be committed » entre dans le prochain commit.
- Les deux autres sections attendent un `git add`.
tests:
- type: qcm
  options:
  - README.md
  - moyenne.py
  - notes.md
  bonne_reponse: 0
solution: |-
  $ git status
  Changes to be committed:
          modified:   README.md

  Changes not staged for commit:
          modified:   moyenne.py

  Untracked files:
          notes.md
