id: s7-15
concept: diff
notion: diff
seance: 7
niveau: normal
type: debug
titre: Il manque les lignes retirées
obligatoire: true
enonce: Ce programme doit afficher les lignes retirées avec `-`, puis les lignes ajoutées avec `+`. Il n'affiche jamais les lignes retirées. Répare-le.
depart: |-
  avant = ["a = 10", "b = 5", "print(a + b)"]
  apres = ["a = 10", "b = 6", "print(a + b)"]

  for ligne in avant:
      if ligne not in avant:
          print("-", ligne)
  for ligne in apres:
      if ligne not in avant:
          print("+", ligne)
indices:
- Une ligne est retirée si elle était dans `avant` et n'est plus dans... laquelle des deux listes ?
- 'Dans la première boucle, `ligne` vient de `avant` : elle ne peut pas être absente de `avant`.'
tests:
- type: sortie
  entrees: []
  attendu: |-
    - b = 5
    + b = 6
solution: |-
  avant = ["a = 10", "b = 5", "print(a + b)"]
  apres = ["a = 10", "b = 6", "print(a + b)"]

  for ligne in avant:
      if ligne not in apres:
          print("-", ligne)
  for ligne in apres:
      if ligne not in avant:
          print("+", ligne)
