id: s1-03
concept: erreurs
notion: afficher
seance: 1
niveau: normal
type: debug
titre: Le guillemet manquant
obligatoire: true
enonce: |
  Ce programme a été tapé trop vite et refuse de démarrer.
  Il devait afficher exactement cette ligne :

  La séance commence

  Au lieu de ça, Python affiche ce message d'erreur :

  SyntaxError: unterminated string literal (detected at line 1)

  Traduction : un texte a été ouvert, mais il n'a jamais été refermé.
  Répare la ligne pour que le message s'affiche enfin.
depart: |
  print("La séance commence)
indices:
  - Un texte s'ouvre et se ferme toujours par le même caractère. Compte les guillemets présents sur la ligne.
  - Le guillemet du début est bien là. C'est celui de la fin, juste avant la parenthèse fermante, qui manque.
tests:
  - type: sortie
    entrees: []
    attendu: |-
      La séance commence
solution: |
  print("La séance commence")
