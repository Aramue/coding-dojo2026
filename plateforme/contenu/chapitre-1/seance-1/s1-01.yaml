id: s1-01
concept: print
seance: 1
niveau: normal
type: predire
titre: Le premier message du QG
obligatoire: true
enonce: |
  Premier contact avec le Quartier Général. Tu n'as rien à écrire ici.
  Le terminal du QG affiche ce programme.
  Lis-le, puis choisis ce qui apparaît à l'écran quand on l'exécute.
depart: |
  print("Bienvenue au QG")
indices:
  - Les guillemets servent à marquer le début et la fin du texte. Demande-toi s'ils font partie du message.
  - Le mot print et les parenthèses sont l'ordre donné à Python, pas le message. Seul ce qui se trouve à l'intérieur des guillemets arrive à l'écran.
tests:
  - type: qcm
    options:
      - Bienvenue au QG
      - '"Bienvenue au QG"'
      - print("Bienvenue au QG")
    bonne_reponse: 0
solution: |
  print("Bienvenue au QG")
