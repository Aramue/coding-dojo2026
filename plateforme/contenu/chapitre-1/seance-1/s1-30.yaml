id: s1-30
concept: conversion
notion: saisie
seance: 1
niveau: normal
type: completer
titre: int(input())
obligatoire: true
enonce: |
  Ce programme demande combien de livres tu as déjà lus cette année,
  puis il annonce le total une fois celui-ci terminé.
  Problème : input() rend toujours du TEXTE, jamais un nombre.
  Tel quel, l'addition est impossible et le programme s'arrête.
  Complète le trou pour que livres contienne un vrai nombre entier.
depart: |
  livres = _____(input("Nombre de livres lus : "))
  print("Après celui-ci, tu en auras", livres + 1)
indices:
  - "Ce que input() te rend est du texte. Il faut le transformer en nombre avant de pouvoir l'additionner."
  - "Souviens-toi des trois familles de valeurs : int, float et str. C'est celle des nombres entiers qu'il te faut, et son nom est aussi celui de la fonction qui convertit."
tests:
  - type: sortie
    entrees: ["12"]
    attendu: |-
      Nombre de livres lus : 12
      Après celui-ci, tu en auras 13
  - type: sortie
    entrees: ["3"]
    attendu: |-
      Nombre de livres lus : 3
      Après celui-ci, tu en auras 4
solution: |
  livres = int(input("Nombre de livres lus : "))
  print("Après celui-ci, tu en auras", livres + 1)
