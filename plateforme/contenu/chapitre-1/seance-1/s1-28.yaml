id: s1-28
concept: input
notion: saisie
seance: 1
niveau: normal
type: completer
titre: Poser la question DANS input()
obligatoire: true
enonce: |
  Ce programme demande un prénom, puis salue la personne.
  La question ne se pose pas dans un print séparé : elle s'écrit entre les
  parenthèses de input().
  Complète le programme pour que la question affichée soit exactement ce texte,
  avec un espace après les deux-points :
  Ton prénom :
depart: |
  prenom = input(_____)
  print("Bonjour " + prenom)
indices:
  - Ce que tu places entre les parenthèses de input() s'affiche à l'écran juste avant que la personne tape sa réponse.
  - "L'invite est du texte : elle se met entre guillemets, à l'intérieur des parenthèses de input(). Ne perds pas l'espace de la fin."
tests:
  - type: sortie
    entrees: ["Camille"]
    attendu: |-
      Ton prénom : Camille
      Bonjour Camille
solution: |
  prenom = input("Ton prénom : ")
  print("Bonjour " + prenom)
