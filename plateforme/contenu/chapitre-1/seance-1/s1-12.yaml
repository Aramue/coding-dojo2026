id: s1-12
concept: reaffectation
notion: variables
seance: 1
niveau: normal
type: predire
titre: Photo, pas formule
obligatoire: true
enonce: |
  Avant de changer le contenu d'une boîte, le programme en range une copie
  dans une deuxième boîte.
  Déroule le programme ligne par ligne. Qu'est-ce qui apparaît à l'écran ?
depart: |
  prenom = "Camille"
  sauvegarde = prenom
  prenom = "Alex"
  print(prenom, sauvegarde)
indices:
  - Arrête-toi juste après la ligne 2 et note ce que contient chaque boîte à cet instant.
  - La ligne 2 recopie dans sauvegarde la valeur que prenom contient à ce moment-là. Ce n'est pas un lien qui se mettrait à jour plus tard.
tests:
  - type: qcm
    options:
      - Alex Camille
      - Alex Alex
      - Camille Camille
    bonne_reponse: 0
solution: |
  prenom = "Camille"
  sauvegarde = prenom
  prenom = "Alex"
  print(prenom, sauvegarde)
