id: s1-07
concept: format exact
notion: afficher
seance: 1
niveau: normal
type: debug
titre: L'espace en trop
obligatoire: true
enonce: |
  Le programme doit afficher exactement ces deux lignes :

  Liste du jour
  Pain Lait Riz

  Celui-ci affiche presque cela. Presque : il glisse un espace en trop quelque part.
  Trouve-le et répare le programme.
depart: |
  print("Liste du jour")
  print("Pain", " Lait", "Riz")
indices:
  - "La première ligne est correcte. L'écart se trouve donc sur la seconde, et il tient en un seul caractère."
  - "Rappelle-toi ce que fait la virgule dans un print() : elle place déjà un espace entre deux morceaux. Regarde maintenant comment commence chaque morceau."
tests:
  - type: sortie
    entrees: []
    exige_exact: true
    attendu: |-
      Liste du jour
      Pain Lait Riz
solution: |
  print("Liste du jour")
  print("Pain", "Lait", "Riz")
