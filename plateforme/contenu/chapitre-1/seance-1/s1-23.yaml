id: s1-23
concept: f-string
notion: types
seance: 1
niveau: normal
type: predire
titre: Le f-string
obligatoire: true
enonce: |
  Il existe une deuxième façon d'assembler du texte et des variables.
  On colle la lettre f juste avant les guillemets ouvrants.
  Ensuite, on écrit les noms des variables entre accolades, directement dans la phrase.
  Lis ce programme. Qu'est-ce qui s'affiche à l'écran ?
depart: |
  prenom = "Camille"
  age = 17
  print(f"{prenom} a {age} ans")
indices:
  - Le f collé aux guillemets n'est pas du texte à afficher. Il change ce que Python fait des accolades.
  - Dans un f-string, chaque paire d'accolades est remplacée par la valeur de la variable écrite dedans.
tests:
  - type: qcm
    options: ["Camille a 17 ans", "{prenom} a {age} ans", "prenom a age ans"]
    bonne_reponse: 0
solution: |
  prenom = "Camille"
  age = 17
  print(f"{prenom} a {age} ans")
