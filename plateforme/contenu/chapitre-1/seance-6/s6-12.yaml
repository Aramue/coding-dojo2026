id: s6-12
concept: requests
notion: requetes
seance: 6
niveau: normal
type: ecrire
titre: L'unité et le vent
obligatoire: false
enonce: |
  Envoie la requête, puis range dans `unite` l'unité de la température (elle se
  trouve dans `current_weather_units`), et dans `vent` la vitesse du vent
  actuelle (`windspeed`, dans `current_weather`).
depart: |
  import requests

  url = "https://api.open-meteo.com/v1/forecast"
  params = {"latitude": 46.2044, "longitude": 6.1432, "current_weather": True}
indices:
  - Les unités sont dans un dictionnaire à part, current_weather_units, qui a les mêmes clés que current_weather.
  - Garde la réponse dans une variable, puis lis-y deux valeurs.
tests:
  - type: variable
    nom: unite
    valeur_attendue: '''°C'''
    type_attendu: str
  - type: variable
    nom: vent
    type_attendu: float
  - type: interdit
    motif: '°C'
solution: |
  import requests

  url = "https://api.open-meteo.com/v1/forecast"
  params = {"latitude": 46.2044, "longitude": 6.1432, "current_weather": True}
  data = requests.get(url, params=params).json()
  unite = data["current_weather_units"]["temperature"]
  vent = data["current_weather"]["windspeed"]
