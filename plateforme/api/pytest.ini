[pytest]
pythonpath = .
# 100 depuis le 27 septembre 2026 : l'API tenait 96 tests et aucune mesure.
# Elle fait 400 lignes de logique — des routes, un schema, des jetons — et
# rien n'y justifie une ligne non mesuree. C'est un cliquet, il ne redescend
# pas.
addopts = --cov=app --cov-report=term-missing --cov-fail-under=100
