# dojo.aramue.com — la plateforme du Coding Dojo.
#
# nginx termine le TLS et relaie vers le conteneur Caddy, publie sur
# 127.0.0.1:3200 seulement ; Caddy sert le front statique et relaie /api vers
# l'API, sur le reseau Docker. Rien de la pile n'est joignable sans passer
# par ici.
#
# A installer sur la VM :
#   sudo cp deploiement/nginx-dojo.aramue.com.conf /etc/nginx/sites-available/dojo.aramue.com
#   sudo ln -s /etc/nginx/sites-available/dojo.aramue.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Le certificat doit exister AVANT ce lien, sinon `nginx -t` echoue sur un
# fichier absent. Voir « Deploiement UNIGE » dans le coffre pour l'ordre exact.

# Les deux zones de debit des routes bornees plus bas. Elles se declarent ici
# parce que `limit_req_zone` vit dans le contexte http, ou ce fichier est
# inclus, et leur nom porte le prefixe `dojo_` parce que la machine heberge
# d'autres sites : deux zones de meme nom empechent nginx de recharger, ce qui
# couperait aussi les leurs.
#
# La cle est l'adresse IP, et UNE CLASSE ENTIERE SORT PAR UNE SEULE ADRESSE.
# Les rafales sont donc dimensionnees pour vingt-quatre eleves qui arrivent
# ensemble, jamais pour une personne seule. Meme raison pour le professeur, qui
# partage cette adresse avec ses eleves : si quelqu'un epuise la limite depuis
# la salle, sa connexion attend elle aussi. C'est le prix, et il est plus petit
# qu'une API tuee au milieu d'une seance.
limit_req_zone $binary_remote_addr zone=dojo_mot_de_passe:1m rate=12r/m;
limit_req_zone $binary_remote_addr zone=dojo_code_acces:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name dojo.aramue.com;

    # Le renouvellement certbot passe par le webroot, comme les autres sites de
    # la machine.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dojo.aramue.com;

    ssl_certificate     /etc/letsencrypt/live/dojo.aramue.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dojo.aramue.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Personne n'envoie de fichier : l'API ne recoit que de petits JSON, et le
    # code des eleves ne quitte jamais leur navigateur (ADR-001).
    client_max_body_size 1m;

    # PAS de `limit_req` a l'echelle du site, contrairement aux autres de la
    # machine. Vingt-quatre eleves dont le WebSocket ne passe pas relisent
    # chacun une fois par seconde : vingt-quatre requetes par seconde sont le
    # fonctionnement NORMAL du repli du quiz, pas un abus (ADR-016). Une limite
    # reglee pour un site vitrine transformerait un reseau d'etablissement
    # capricieux en quiz casse.
    #
    # Trois routes font exception, plus bas, et ce sont les seules : celles dont
    # le cout ou le secret ne depend pas de nous.
    #
    # Aucun `proxy_cache` non plus : Caddy pose deja les bons en-tetes, un an
    # sur Pyodide et les polices, `no-cache` sur le contenu — et mettre /api en
    # cache servirait a un eleve l'etat d'un autre.
    #
    # Aucun oauth2-proxy : les eleves n'ont pas de compte, ils entrent un code
    # d'acces (ADR-002).

    # Les en-tetes communs, poses ici pour que chaque `location` n'ait plus que
    # ce qui lui est propre.
    #
    # ATTENTION : un seul `proxy_set_header` dans un `location` annule TOUS ceux
    # herites de ce niveau. nginx ne fusionne pas les deux listes, il prend la
    # plus proche. Un `location` qui doit en ajouter un les repete donc tous,
    # comme la sonnette plus bas.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 429 plutot que le 503 par defaut : « reessaie », pas « je suis en panne ».
    # L'interface en fait deux messages qui disent d'attendre, au lieu
    # d'envoyer un eleve chercher son professeur pour une limite qui se leve
    # toute seule.
    limit_req_status 429;

    # La sonnette du quiz, en premier parce que nginx prend le prefixe le plus
    # long. Elle est SILENCIEUSE entre deux questions : avec le
    # `proxy_read_timeout` par defaut de 60 s, nginx la fermerait toutes les
    # minutes. Les ecrans se rebrancheraient seuls, le repli est fait pour ca,
    # mais on paierait une reconnexion par minute et par eleve pour rien.
    #
    # Jamais de `limit_req` ici : une sonnette coupee, c'est le repli a une
    # requete par seconde et par eleve, donc exactement ce qu'il ne faut pas
    # brider.
    location /api/quiz/flux {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Les deux routes du mot de passe professeur. Elles le hachent avec scrypt,
    # volontairement lent et gourmand en memoire — c'est ce qui le protege d'un
    # dictionnaire. Ce sont aussi les deux seules routes ouvertes SANS jeton
    # dont le cout se decide ailleurs qu'ici : sans borne, on peut le faire
    # payer au serveur aussi souvent qu'on le demande, et l'API est un seul
    # processus (ADR-016) borne a 512 Mo (`production.yml`).
    #
    # Douze par minute laissent au professeur de quoi se tromper plusieurs fois
    # de suite ; la rafale couvre l'ouverture de `/prof`, qui lit deja
    # `/prof/compte` pour savoir quelle porte afficher.
    #
    # `=` : correspondance exacte, pour ne border que ces deux routes et pas le
    # reste de `/api/prof/`, qui demande deja un jeton.
    location = /api/prof/connexion {
        limit_req zone=dojo_mot_de_passe burst=8 nodelay;
        proxy_pass http://127.0.0.1:3200;
    }

    location = /api/prof/compte {
        limit_req zone=dojo_mot_de_passe burst=8 nodelay;
        proxy_pass http://127.0.0.1:3200;
    }

    # `/session` echange un code d'acces contre un jeton. Le code tient en
    # quatre caracteres (ADR-002) : sans borne, on les essaie tous en quelques
    # minutes, et un code trouve donne le prenom, la progression et la place au
    # quiz de son porteur.
    #
    # La rafale de quarante est le chiffre qui compte : vingt-quatre eleves
    # derriere UNE adresse IP tapent leur code dans la meme minute, fautes de
    # frappe comprises. Trente par minute ensuite, ce qui ramene un balayage
    # complet de plusieurs minutes a plusieurs jours.
    location = /api/session {
        limit_req zone=dojo_code_acces burst=40 nodelay;
        proxy_pass http://127.0.0.1:3200;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
    }
}
